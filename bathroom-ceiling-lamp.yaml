# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml

esphome:
  name: bathroom-ceiling-lamp
  friendly_name: Bathroom Ceiling Lamp

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "XXXXXXXXXXXXX"

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Bathroom Ceilin Fallback Hotspot
    password: "XXXXXXXXXXX"

captive_portal:

light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRBW
    chipset: SK6812
    pin: GPIO20
    num_leds: 100
    name: "Main Lights"
    id: main_light

uart:
  - rx_pin: GPIO14
    baud_rate: 9600
    id: dummy_uart
  - id: ld2420_uart
    tx_pin: GPIO17
    rx_pin: GPIO18
    baud_rate: 115200
    parity: NONE
    stop_bits: 1

  
ld2420:
  uart_id: ld2420_uart

text_sensor:
  - platform: ld2420
    fw_version:
      name: LD2420 Firmware

sensor:
  - platform: ld2420
    moving_distance:
      name : Moving Distance
      
binary_sensor:
  - platform: ld2420
    has_target:
      name: Presence
      filters:
        - delayed_off: 15s
      on_press:
        then:
          - light.turn_on:
              id: main_light
              brightness: 100%        
      on_release:
        then:
          - light.turn_off:
              id: main_light

select:
  - platform: ld2420
    operating_mode:
      name: Operating Mode

number:
  - platform: ld2420
    presence_timeout:
      name: Detection Presence Timeout
    min_gate_distance:
      name: Detection Gate Minimum
    max_gate_distance:
      name: Detection Gate Maximum
    # See "Number" section below for detail
    gate_select:
      name: Select Gate to Set
    still_threshold:
      name: Set Still Threshold Value
    move_threshold:
      name: Set Move Threshold Value

button:
  - platform: ld2420
    apply_config:
      name: Apply Config
    factory_reset:
      name: Factory Reset
    restart_module:
      name: Restart Module
    revert_config:
      name: Undo Edits
